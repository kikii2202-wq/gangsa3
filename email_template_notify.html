<!doctype html>
<html lang="ko">
<body style="margin:0;padding:0;background:#f5f1ea;font-family:Arial,'Noto Sans KR',sans-serif;color:#242019;">
  <div style="max-width:640px;margin:0 auto;padding:28px 16px;">
    <div style="background:#ffffff;border:1px solid #ded5c9;padding:32px;">
      <p style="margin:0 0 10px;font-size:11px;letter-spacing:1.2px;color:#74695d;">NEW INQUIRY</p>
      <h1 style="margin:0 0 24px;font-size:25px;line-height:1.35;color:#242019;">새 강의 문의가 도착했습니다.</h1>
      <table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;line-height:1.55;">
        <tr><td style="width:130px;padding:10px 0;border-top:1px solid #ded5c9;color:#74695d;">이름</td><td style="padding:10px 0;border-top:1px solid #ded5c9;">{{from_name}}</td></tr>
        <tr><td style="padding:10px 0;border-top:1px solid #ded5c9;color:#74695d;">이메일</td><td style="padding:10px 0;border-top:1px solid #ded5c9;">{{from_email}}</td></tr>
        <tr><td style="padding:10px 0;border-top:1px solid #ded5c9;color:#74695d;">연락처</td><td style="padding:10px 0;border-top:1px solid #ded5c9;">{{phone}}</td></tr>
        <tr><td style="padding:10px 0;border-top:1px solid #ded5c9;color:#74695d;">소속</td><td style="padding:10px 0;border-top:1px solid #ded5c9;">{{company}}</td></tr>
        <tr><td style="padding:10px 0;border-top:1px solid #ded5c9;color:#74695d;">문의 유형</td><td style="padding:10px 0;border-top:1px solid #ded5c9;">{{inquiry_type}}</td></tr>
        <tr><td style="padding:10px 0;border-top:1px solid #ded5c9;color:#74695d;vertical-align:top;">문의 내용</td><td style="padding:10px 0;border-top:1px solid #ded5c9;white-space:pre-wrap;">{{message}}</td></tr>
        <tr><td style="padding:10px 0;border-top:1px solid #ded5c9;color:#74695d;">접수 시각</td><td style="padding:10px 0;border-top:1px solid #ded5c9;">{{submitted_at}}</td></tr>
        <tr><td style="padding:10px 0;border-top:1px solid #ded5c9;color:#74695d;">유입 페이지</td><td style="padding:10px 0;border-top:1px solid #ded5c9;word-break:break-all;">{{page_url}}</td></tr>
        <tr><td style="padding:10px 0;border-top:1px solid #ded5c9;color:#74695d;">개인정보 동의</td><td style="padding:10px 0;border-top:1px solid #ded5c9;">{{privacy_agreed}} ({{agreed_at}})</td></tr>
      </table>
      <p style="margin:28px 0 0;"><a href="mailto:{{from_email}}" style="display:inline-block;background:#242019;color:#ffffff;padding:13px 18px;text-decoration:none;font-size:14px;font-weight:bold;">문의자에게 회신하기 →</a></p>
    </div>
  </div>
</body>
</html>
